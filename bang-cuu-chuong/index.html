<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<title>Bảng cửu chương </title>
    <style> 

        body {
            font-family: Arial;
            text-align: center;
        }

        table {
            margin: auto;
            border-collapse: collapse;
        }

        td {
            border: 1px solid #333;
            padding: 10px;
            width: 90px;
            text-align: center;
            background-color: #f2f2f2;
        }

        td:hover {
            background-color: yellow;
            cursor: pointer;
        }

        h1 {
            color: darkblue;
        }

    </style>
</head>
<body> 
	<script>
		let sout;

sout = "<table border='1' cellspacing='0' cellpadding='5'>";

for (let i = 1; i <= 10; i++) {

    sout += "<tr>";

    for (let j = 1; j <= 10; j++) {

        sout += "<td>" + i + " x " + j + " = " + (i * j) + "</td>";

    }

    sout += "</tr>";
}

sout += "</table>";

document.write(sout);
	</script>
</body>
</html
